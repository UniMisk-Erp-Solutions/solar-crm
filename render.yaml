# Render Blueprint: the Node API (the only server-side part). The database, sign-in and file storage stay on Supabase;
# the React app is deployed on Vercel (apps/web). Create it with: Render -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: solar-crm-api
    runtime: node
    plan: starter            # always-on (the reminder / escalation engine runs inside it). The free plan sleeps, so do not use it.
    region: singapore
    buildCommand: npm ci && npm run build -w @solar/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: RUN_JOBS, value: "true" }
      - { key: MAX_UPLOAD_MB, value: "10" }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }       # the Vercel web address, e.g. https://solar-crm.vercel.app
      - { key: PUBLIC_API_URL, sync: false }     # this service's own address, e.g. https://solar-crm-api.onrender.com
      - { key: FILE_TOKEN_SECRET, generateValue: true }
      - { key: UNSUBSCRIBE_TOKEN_SECRET, generateValue: true }
